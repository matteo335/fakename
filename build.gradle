plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id "org.parchmentmc.librarian.forgegradle" version "1+"
    id 'org.spongepowered.mixin' version "0.7.+"
}

base.archivesName = mod_id
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "parchment", version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            taskName "MainDev"
            workingDirectory = file("run/main_client")
            args "--username=MainDev"
        }

        client2 {
            taskName "OffDev"
            workingDirectory = file("run/off_dev")
            args "--username=OffDev"
        }

        server {
            taskName "server"
            jvmArgs("-Xmx8G")
            workingDirectory = file("run/server")
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        forRepositories(fg.repository)
        filter {
            includeGroup "maven.modrinth"
        }
    }

    maven {url "https://cursemaven.com" }
    maven { url = "https://maven.bawnorton.com/releases" }
}

dependencies {
    minecraft "net.minecraftforge:forge:${dev_minecraft_version}-${dev_forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation "maven.modrinth:8EWJHAmb:RoiJxIka"
    implementation fg.deobf("curse.maven:emotecraft-forge-403422:4632460")
    implementation fg.deobf("curse.maven:playeranimator-658587:4587214")

    compileOnly fg.deobf("curse.maven:botania-225643:6870713")
    compileOnly fg.deobf("curse.maven:artifacts-312353:6399828")
    compileOnly fg.deobf("curse.maven:variants-and-ventures-981139:5751852")

    implementation fg.deobf("curse.maven:spawn-cap-range-adjuster-1315305:6821247")

    implementation "org.jctools:jctools-core:4.0.3"
    minecraftLibrary "org.jctools:jctools-core:4.0.3"
    runtimeOnly "org.jctools:jctools-core:4.0.3"

    jarJar("org.jctools:jctools-core:[4.0.3,5.0.0)") { dep ->
        jarJar.pin(dep, "4.0.3")
    }

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7-beta.1"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.7-beta.1")) {
        jarJar.ranged(it, "[0.3.7-beta.1,)")
    }

    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0")) {
        jarJar.ranged(it, "[0.5.0,)")
    }
}

mixin {
    add sourceSets.main, "dawn_of_heroes_plus.refmap.json"
    config "networklogger.mixins.json"
    config "force_animation.mixins.json"
}

processResources {
    var properties = [
            'forge_version' : forge_version,
            'dev_forge_version' : dev_forge_version,
            'minecraft_version' : minecraft_version,
            'networklogger_version' : networklogger_version,
            'force_animation_version' : force_animation_version,
            'tpsum_version' : tpsum_version
    ]

    filesMatching(["META-INF/mods.toml"]) {
        expand properties
    }

    inputs.properties(properties)
}