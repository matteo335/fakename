plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}


java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = project.neoforge_version

    runs {
        MainDev {
            client()
            gameDirectory = file("run/main_dev")
            programArgument "--username=MainDev"
        }

        OffDev {
            client()
            gameDirectory = file("run/off_dev")
            programArgument "--username=OffDev"
        }

        server {
            server()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    source rootProject.file("common/src/main/java")
}

processResources {
    from rootProject.file('common/src/main/resources')

    var props = ['mod_version': mod_version]
    inputs.properties props

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand props
    }
}