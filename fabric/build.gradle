plugins {
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
}

dependencies {
    minecraft "com.mojang:minecraft:${project.dev_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.named('compileJava', JavaCompile) {
    source rootProject.file('common/src/main/java')
}

processResources {
    from rootProject.file('common/src/main/resources')

    var props = ['mod_version': mod_version]
    inputs.properties props

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand props
    }
}